{% extends "base.html" %}
{% block title %}Add Website - SiteWatch{% endblock %}
{% block content %}
<h2>Add Website</h2>
<div class="form-card">
<form method="post">
    <label for="url">Website URL</label>
    <input id="url" name="url" type="text" placeholder="https://example.com" required>

    <label for="interval">Monitoring interval</label>
    <select id="interval" name="interval">
        <option value="30">30 seconds</option>
        <option value="60">60 seconds</option>
    </select>

    <button class="button" type="submit">Add and Check Website</button>
</form>
</div>
<p class="note">Only public HTTP and HTTPS websites are accepted. Local and private network addresses are blocked.</p>
{% endblock %}
